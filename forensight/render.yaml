services:
  - type: web
    name: forensight-nightfall-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_ENV
        value: render
      - key: NIGHTFALL_DATA_DIR
        value: /tmp/forensight-nightfall
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
