services:
  - type: web
    name: forensight-evidence-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DEPLOYMENT_ENV
        value: render
      - key: FORENSIGHT_MODE
        value: offline
      - key: AI_PROVIDER
        value: none
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
